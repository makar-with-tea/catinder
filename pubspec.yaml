name: catinder
description: "Like tinder, but better, because there are cats."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  logging: ^1.2.0
  http: ^1.3.0
  cached_network_image: ^3.0.0
  flutter_secure_storage: ^9.2.4
  flutter_launcher_icons: ^0.14.3
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.0.2
  flutter_bloc: ^9.1.1
  get_it: ^8.0.3
  flutter_intl: ^0.0.1
  flutter_localizations:
    sdk: flutter
  drift: ^2.0.0
  drift_flutter: ^0.2.4
  path_provider: ^2.0.1
  connectivity_plus: ^4.0.2
  mockito: ^5.0.17

dev_dependencies:
  drift_dev: ^2.0.0
  build_runner: ^2.0.0
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

flutter_intl:
  enabled: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/kitty.png"